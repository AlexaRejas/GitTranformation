server:
    port: 8086

spring:
    datasource:
        #url: ${SPRING_DATASOURCE_URL}
        #username: ${SPRING_DATASOURCE_USERNAME}
        #password: ${SPRING_DATASOURCE_PASSWORD}
        url: jdbc:postgresql://ep-odd-sun-a56iuqcm-pooler.us-east-2.aws.neon.tech/db_prs1?sslmode=require
        username: db_prs1_owner
        password: npg_1sQejrO2hupA
        driver-class-name: org.postgresql.Driver

        hikari:
            connection-timeout: 30000
            idle-timeout: 600000
            max-lifetime: 1800000

    jpa:
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
                format_sql: true
        show-sql: true

    web:
        cors:
            allowed-origins: "http://localhost:4200"
            allowed-methods: "GET, POST, PUT, DELETE"
            allowed-headers: "*"
            allow-credentials: true

    security:
        oauth2:
            resourceserver:
                jwt:
                    enabled: false

# Configuración de SpringDoc OpenAPI
springdoc:
    api-docs:
        enabled: true
        path: /api-docs
    swagger-ui:
        path: /swagger-ui.html
        enabled: true
        config-url: /api-docs/swagger-config
        urls:
            - url: /api-docs
              name: API Documentation
    show-actuator: true
    paths-to-match: /**

# Se agrega opción para eliminar la advertencia
jvm-options:
    - "-Djdk.instrument.traceUsage"

# Configuración para tokens de microservicios
service:
    api:
        family: https://vg-ms-family-dcex.onrender.com